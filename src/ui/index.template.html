<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analizador de CSV</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__FAV__">
<style>
:root{--bg:#f3f4f7;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#e4e7ec;--accent:#3b6ef6;--accent-soft:rgba(59,110,246,.1);--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.04);--logo:none;--ok-ink:#15803d;--crit-ink:#b91c1c;--warn-ink:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--panel:#161a22;--text:#e8ebf2;--muted:#8c96a8;--line:#262c38;--accent:#7ba2ff;--accent-soft:rgba(123,162,255,.14);--shadow:0 1px 2px rgba(0,0,0,.4);--logo:invert(1);--ok-ink:#4ade80;--crit-ink:#fca5a5;--warn-ink:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--panel:#161a22;--text:#e8ebf2;--muted:#8c96a8;--line:#262c38;--accent:#7ba2ff;--accent-soft:rgba(123,162,255,.14);--shadow:0 1px 2px rgba(0,0,0,.4);--logo:invert(1);--ok-ink:#4ade80;--crit-ink:#fca5a5;--warn-ink:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box} ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box;border:2px solid transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header,footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
header{position:sticky;top:0;z-index:20}
footer{border-top:1px solid var(--line);border-bottom:0;margin-top:auto;color:var(--muted);font-size:13px}
footer .logo{height:22px;filter:var(--logo)} footer .ver{margin-left:auto;font-variant-numeric:tabular-nums}
.brand{margin:0 14px 0 0;display:flex;align-items:center;font-size:0}
.logo-app{height:40px;display:block} .logo-app.dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-app.lt{display:none}:root:not([data-theme="light"]) .logo-app.dk{display:block}}
:root[data-theme="dark"] .logo-app.lt{display:none}:root[data-theme="dark"] .logo-app.dk{display:block}
#sidetoggle{display:none;font-size:15px;padding:6px 11px}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--bg);padding:4px;border-radius:12px}
nav button{border:0;background:none;color:var(--muted);padding:6px 15px;border-radius:9px;font-weight:500;white-space:nowrap}
nav button:hover{background:none;color:var(--text)}
nav button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.wrap{display:grid;grid-template-columns:312px 1fr;gap:18px;padding:18px 22px;align-items:start;width:100%;max-width:1600px;margin:0 auto}
aside,.box,table,.cw,.empty{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
aside{padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:76px}
.drop{display:block;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:18px 14px;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop::before{content:"⬆";display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin:0 auto 8px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:17px}
.drop:hover,body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)} .drop span{font-size:12px}
.file{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.file small,small,.muted{color:var(--muted);display:block;font-size:12px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px} .x:hover{background:var(--accent-soft);color:var(--text);border:0}
.box{padding:12px;display:flex;flex-direction:column;gap:9px;box-shadow:none}
h3{margin:0;font-size:13px;font-weight:600}
select,input,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;max-width:100%;transition:border-color .15s,background .15s,box-shadow .15s}
select:hover,input:hover{border-color:var(--muted)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
button{cursor:pointer;background:var(--panel);font-weight:500} button:hover{border-color:var(--accent);background:var(--accent-soft)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff} button.pri:hover{filter:brightness(1.08);background:var(--accent)}
.row{display:flex;gap:6px} .row input{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.bar label{display:flex;gap:6px;align-items:center}
.si{display:flex;align-items:flex-start;gap:7px;padding:4px 7px;margin:0 -7px;border-radius:8px;font-size:13px;cursor:pointer} .si:hover{background:var(--bg)} .si.on{background:var(--accent-soft)} .si input{margin-top:3px} .si span{flex:1;min-width:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:5px 0 0;flex:none}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.warn{margin:0;font-size:12px;color:var(--warn-ink)}
.cw{position:relative;margin-bottom:12px;overflow:hidden}
canvas{display:block;width:100%;touch-action:pan-y}
.pexp{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s;z-index:3}
.cw:hover .pexp,.pexp:focus-within{opacity:1} @media(hover:none){.pexp{opacity:1}}
.pexp button{padding:3px 9px;font-size:12px}
.tip{position:absolute;top:56px;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:0 10px 32px rgba(0,0,0,.22);z-index:2;font-variant-numeric:tabular-nums;line-height:1.65;max-width:400px}
.tip small{display:inline}
.sel{position:absolute;top:58px;bottom:150px;background:var(--accent-soft);border:1px solid var(--accent);pointer-events:none;border-radius:4px}
i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;margin-bottom:14px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap} td:first-child{white-space:normal} th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0} tbody tr:hover td{background:var(--bg)}
th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--bg)}
.empty{padding:44px 24px;text-align:center;color:var(--muted);box-shadow:none}
#main{min-width:0;overflow-x:auto}
.exp{display:flex;gap:8px;align-items:center;margin-left:auto}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h3.t{margin:6px 0 10px;display:flex;align-items:center;gap:10px;font-size:14px}
.pf{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
label.btn{display:inline-block;cursor:pointer;font:inherit;font-weight:500;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px;transition:border-color .15s,background .15s} label.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
button:disabled{opacity:.45;cursor:default}
input[type=text]{min-width:0}
.row input[type=text]{flex:1}
.ph2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ph2 select{min-width:200px}
.ph2.conf{padding:10px 12px;border:1px solid var(--crit-ink);border-radius:12px;color:var(--crit-ink)}
button.danger{border-color:var(--crit-ink);color:var(--crit-ink)}
details.menu{position:relative} details.menu>summary{list-style:none;cursor:pointer} details.menu>summary::-webkit-details-marker{display:none}
.menu .mi{position:absolute;left:0;top:calc(100% + 6px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;min-width:270px;box-shadow:0 10px 32px rgba(0,0,0,.22)}
.menu .mi button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px} .menu .mi button:hover{background:var(--bg)}
.dirty{color:var(--warn-ink);font-size:12px}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 2px 14px}
table.rt input,table.rt select{background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:0;padding:3px 4px}
table.rt input:hover,table.rt select:hover{border-color:var(--line);background:var(--bg)}
table.rt input:focus,table.rt select:focus{border-color:var(--accent);background:var(--bg);outline:none;box-shadow:none}
table.rt input.bad{border-color:var(--crit-ink)}
table.rt input:disabled{opacity:.4}
table.rt td{vertical-align:middle}
table.rt th,table.rt td{padding:8px 6px}
table.rt .nm{min-width:200px} table.rt .nm input{display:block;width:100%} table.rt .nm1{font-weight:600} table.rt .pt{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
table.rt .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px}
table.rt .sub select{font-size:12px;padding:1px 2px}
table.rt .x{opacity:.45} table.rt tr:hover .x{opacity:1}
.chip{display:inline-block;min-width:22px;text-align:center;padding:1px 8px;border-radius:999px;background:var(--bg);font-size:12px} .chip.zero{color:var(--warn-ink)}
.guide{display:flex;flex-direction:column;gap:14px}
.guide details.box>summary{font-weight:600;cursor:pointer}
.guide ol{margin:6px 0 0 18px;padding:0} .guide li{margin:5px 0} .guide p{margin:6px 0}
pre.code{margin:8px 0;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:380px;user-select:all}
.b{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b.crit{background:rgba(220,38,38,.15);color:var(--crit-ink)} .b.warn{background:rgba(245,158,11,.2);color:var(--warn-ink)}
table.al th,table.al td{text-align:left;white-space:nowrap} table.al td.p{white-space:normal} table.al td.n,table.al th.n{text-align:right}
.go{padding:3px 10px;font-size:12px}
.more{display:block;margin:0 auto 14px}
.ah{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 2px 10px}
.ah small{color:var(--muted)}
.nr{margin:2px 4px 16px;font-size:12px}
.ok{color:var(--muted)}
table.al{margin-bottom:10px}
.up{color:var(--accent);font-weight:600} .dn{color:var(--warn-ink);font-weight:600}
@media(max-width:820px){
  .wrap{grid-template-columns:1fr;padding:12px 14px;gap:12px}
  body[data-view=thresholds] .pf{display:none}
  #sidetoggle{display:inline-block}
  aside{display:none;max-height:45vh;position:static} body.side-open aside{display:flex}
  .pf{margin-left:0;width:100%} .pf select{flex:1}
  .logo-app{height:32px} header{padding:8px 14px} footer{padding:10px 14px} .brand{margin-right:6px}
}
@media(max-width:760px){
  table.cards{border:0;background:none;display:block;overflow:visible;box-shadow:none}
  table.cards tbody{display:block}
  table.cards tr:first-child{display:none}
  table.cards tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  table.cards td{display:block;padding:0;border:0;text-align:left !important;white-space:normal !important}
  table.cards td::before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}
  table.cards td[data-label=""]::before{display:none}
  table.cards td.nm,table.cards td.p,table.cards td.cr{grid-column:1/-1}
  table.cards td.nm{min-width:0}
  table.rt td.mv{order:10} table.rt td.dl{order:11;text-align:right !important}
  table.rt input[type=text],table.rt select{width:100% !important}
  .grid2{grid-template-columns:1fr}
  .exp{margin-left:0;width:100%;flex-wrap:wrap}
  .ph2 select{min-width:0;flex:1 1 100%}
  .menu .mi{left:auto;right:0}
}
@media(max-width:480px){
  nav button{padding:6px 9px;font-size:13px}
  .exp button,.exp select{font-size:13px;padding:5px 8px}
  .bar{gap:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body class="side-open">
<header>
  <button id="sidetoggle" data-act="side" aria-label="Archivos y series">☰ Archivos</button>
  <h1 class="brand"><img class="logo-app lt" alt="Analizador de CSV"><img class="logo-app dk" alt="" aria-hidden="true"></h1>
  <nav><button data-tab="explore" class="on">Explorar</button><button data-tab="compare">Comparar</button><button data-tab="thresholds">Umbrales</button><button data-tab="guide">Instrucciones</button></nav>
  <label class="pf">Umbrales <select id="prof" data-pf="active" title="Perfil de umbrales activo"></select></label>
</header>
<div class="wrap"><aside id="side"></aside><main id="main"></main></div>
<footer><img class="logo" alt=""><span>Desarrollado por Tomas Sandoval</span><span class="ver">Versión __VERSION__</span></footer>
<div id="toast" hidden></div>

const LOGO = "data:image/png;base64,__LOGO__";
const LOGO_L = "data:image/png;base64,__LOGO_L__", LOGO_D = "data:image/png;base64,__LOGO_D__";
/*CORE*/

</script>
</body>
</html>
